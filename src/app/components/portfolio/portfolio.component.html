<section id="portfolio" class="portfolio-section">
    <!-- Animated Background Shapes -->
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container">
        <h2 class="section-title">
            <span>My Portfolio</span>
            <div class="title-underline"></div>
        </h2>

        <div class="projects-grid" *ngIf="projects$ | async as projects">
            <div class="project-card" *ngFor="let project of projects">
                <div class="card-image">
                    <img [src]="project.imageUrl" [alt]="project.title">
                    <div class="overlay">
                        <div class="links">
                            <a *ngIf="project.links.demo" [href]="project.links.demo" target="_blank" class="btn-link btn-visit-site">Visit Site &rarr;</a>
                            <a [href]="project.links.github" target="_blank" class="btn-link">GitHub</a>
                        </div>
                    </div>
                </div>
                <div class="card-content">
                    <h3 class="project-title">{{ project.title }}</h3>
                    <p class="project-desc">{{ project.description }}</p>
                    <div class="tags">
                        <span class="tag" *ngFor="let tag of project.tags">{{ tag }}</span>
                    </div>
                    <div class="card-footer">
                        <a [href]="project.links.github" target="_blank" class="btn-github">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="currentColor">
                                <path
                                    d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z" />
                            </svg>
                            GitHub
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
