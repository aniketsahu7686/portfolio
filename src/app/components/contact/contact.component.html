<section id="contact" class="contact-section">
    <div class="container">
        <h2 class="section-title light">Get In Touch</h2>

        <div class="contact-wrapper">
            <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" formControlName="name" placeholder="Your Name"
                        [class.error]="contactForm.get('name')?.invalid && submitted">
                    <small class="error-msg" *ngIf="contactForm.get('name')?.invalid && submitted">Name is
                        required</small>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" formControlName="email" placeholder="Your Email"
                        [class.error]="contactForm.get('email')?.invalid && submitted">
                    <small class="error-msg" *ngIf="contactForm.get('email')?.invalid && submitted">Valid email is
                        required</small>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" formControlName="message" rows="5" placeholder="Your Message"
                        [class.error]="contactForm.get('message')?.invalid && submitted"></textarea>
                    <small class="error-msg" *ngIf="contactForm.get('message')?.invalid && submitted">Message is
                        required</small>
                </div>

                <button type="submit" class="btn-submit">Send Message</button>
            </form>
        </div>
    </div>
</section>
