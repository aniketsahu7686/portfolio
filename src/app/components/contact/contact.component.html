<section id="contact" class="contact-section">
    <!-- Animated Background Shapes -->
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container">
        <h2 class="section-title light"><span>Get In Touch</span></h2>

        <div class="contact-wrapper glass-card">
            <div class="card-content">
                <p class="subtitle">Let's build something amazing together.</p>

                <form class="contact-form" (ngSubmit)="sendEmail()">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" [(ngModel)]="form.name" name="name" placeholder="Deepak Singh"
                            [class.error]="!form.name && submitted">
                        <small class="error-msg" *ngIf="!form.name && submitted">Name is
                            required</small>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" [(ngModel)]="form.email" name="email"
                            placeholder="Deepak34@example.com" [class.error]="!form.email && submitted">
                        <small class="error-msg" *ngIf="!form.email && submitted">Valid email is
                            required</small>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" [(ngModel)]="form.phone" name="phone" placeholder="+91 9876543210">
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" [(ngModel)]="form.message" name="message" rows="5"
                            placeholder="Send me a message." [class.error]="!form.message && submitted"></textarea>
                        <small class="error-msg" *ngIf="!form.message && submitted">Message is
                            required</small>
                    </div>

                    <div class="success-msg" *ngIf="successMessage">{{ successMessage }}</div>
                    <div class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</div>

                    <button type="submit" class="btn-submit" [disabled]="loading">
                        <span class="btn-text">{{ loading ? 'Sending...' : 'Send Message' }}</span>
                        <div class="btn-glow"></div>
                    </button>
                </form>
            </div>
        </div>
    </div>
</section>
