<section id="contact" class="contact-section">
    <!-- Animated Background Shapes -->
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container">
        <h2 class="section-title light"><span>Get In Touch</span></h2>

        <div class="contact-wrapper glass-card">
            <div class="card-content">
                <p class="subtitle">Let's build something amazing together.</p>

                <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="contact-form">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" formControlName="name" placeholder="Deepak Singh"
                            [class.error]="contactForm.get('name')?.invalid && submitted">
                        <small class="error-msg" *ngIf="contactForm.get('name')?.invalid && submitted">Name is
                            required</small>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" formControlName="email" placeholder="Deepak34@example.com"
                            [class.error]="contactForm.get('email')?.invalid && submitted">
                        <small class="error-msg" *ngIf="contactForm.get('email')?.invalid && submitted">Valid email is
                            required</small>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" formControlName="phone" placeholder="+91 9876543210"
                            [class.error]="contactForm.get('phone')?.invalid && submitted">
                        <small class="error-msg" *ngIf="contactForm.get('phone')?.invalid && submitted">
                            Invalid phone number
                        </small>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" formControlName="message" rows="5"
                            placeholder="Send me a message."
                            [class.error]="contactForm.get('message')?.invalid && submitted"></textarea>
                        <small class="error-msg" *ngIf="contactForm.get('message')?.invalid && submitted">Message is
                            required</small>
                    </div>

                    <button type="submit" class="btn-submit">
                        <span class="btn-text">Send Message</span>
                        <div class="btn-glow"></div>
                    </button>
                </form>
            </div>
        </div>
    </div>
</section>
