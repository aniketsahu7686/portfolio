<section id="skills" class="skills-section">
    <div class="container">
        <!-- New Layout: Categories -->
        <div class="skills-container" *ngIf="groupedSkills$ | async as groupedSkills">
            <div class="category-group" *ngFor="let group of groupedSkills">
                <!-- Category Title -->
                <h3 class="category-title" *ngIf="group.skills.length > 0">{{ group.category }}</h3>

                <!-- Skills Grid -->
                <div class="skills-grid">
                    <div class="skill-card" *ngFor="let skill of group.skills">
                        <div class="icon-wrapper">
                            <img [src]="skill.icon" [alt]="skill.name" loading="lazy">
                        </div>
                        <h4 class="skill-name">{{ skill.name }}</h4>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
